name: ERP checks

on:
  push:
    branches: [phase2_new_start]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend-python/requirements.txt
      - run: python -m pip install -r requirements.txt
        working-directory: backend-python
      - run: python -m unittest discover -s tests -v
        working-directory: backend-python

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Disposable CI database only; never used by a deployed installation.
      POSTGRES_PASSWORD: ci-only-database-password
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose files
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.python.yml config --quiet
      - name: Build and wait for healthy services
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Check application endpoints
        run: |
          curl --fail --retry 5 --retry-delay 2 http://localhost:3001/api/ready
          curl --fail --retry 5 --retry-delay 2 --output /dev/null http://localhost:3000/auth
      - name: Collect service logs
        if: always()
        run: docker compose logs --no-color --tail 100
      - name: Remove disposable CI containers and volumes
        if: always()
        run: docker compose down -v
